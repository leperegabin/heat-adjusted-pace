<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equal-effort pace · Allure à effort égal</title>
<meta name="description" content="Calculez votre allure ajustée à la chaleur, à l'humidité, au soleil, au vent et à l'altitude, selon un modèle estimé sur 10 398 performances de compétition. / Compute your heat-adjusted running pace.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F2EA; --surface: #FFFDF8; --surface-2: #F0EAE0; --ink: #23252B; --ink-2: #4B4D54; --muted: #857E73;
  --line: #E3DACC; --accent: #B4462E; --accent-2: #8F3622; --accent-soft: rgba(180, 70, 46, .10);
  --band: rgba(180, 70, 46, .16); --warn-bg: #FBF0E0; --warn-ink: #7A4B0C; --stop-bg: #F8E6E1; --stop-ink: #8F3622;
  --shadow: 0 1px 2px rgba(35, 37, 43, .05), 0 10px 30px rgba(35, 37, 43, .07);
  --radius: 16px; --serif: "EB Garamond", Garamond, Georgia, serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131417; --surface: #1B1C20; --surface-2: #24262B; --ink: #ECE7DF; --ink-2: #C8C2B8; --muted: #9A9388;
    --line: #2E3036; --accent: #E2795C; --accent-2: #F09A80; --accent-soft: rgba(226, 121, 92, .14);
    --band: rgba(226, 121, 92, .20); --warn-bg: #2E2416; --warn-ink: #E9C38A; --stop-bg: #33201B; --stop-ink: #F0A58F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131417; --surface: #1B1C20; --surface-2: #24262B; --ink: #ECE7DF; --ink-2: #C8C2B8; --muted: #9A9388;
  --line: #2E3036; --accent: #E2795C; --accent-2: #F09A80; --accent-soft: rgba(226, 121, 92, .14);
  --band: rgba(226, 121, 92, .20); --warn-bg: #2E2416; --warn-ink: #E9C38A; --stop-bg: #33201B; --stop-ink: #F0A58F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: var(--accent); text-underline-offset: 3px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }

/* ---------------------------------------------------------------- en-tête */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0 0; }
.brand { font: 600 13px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.brand b { color: var(--accent); font-weight: 600; }
.tools { display: flex; gap: 8px; align-items: center; }
.pill-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.pill-switch button { border: 0; background: transparent; color: var(--ink-2); font: 600 12px/1 var(--sans); letter-spacing: .06em;
  padding: 7px 11px; border-radius: 999px; cursor: pointer; }
.pill-switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon-btn { width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
.hero { padding: 44px 0 30px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, .8fr); gap: 40px; align-items: end; }
.kicker { font: 600 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
h1 { font: 500 clamp(38px, 5.2vw, 62px)/1.04 var(--serif); margin: 0; letter-spacing: -.01em; }
h1 em { color: var(--accent); font-style: italic; }
.lede { font-size: 16.5px; color: var(--ink-2); margin: 18px 0 0; max-width: 60ch; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; }
.fact { background: var(--surface); padding: 16px 16px 14px; }
.fact .n { font: 500 30px/1 var(--serif); font-variant-numeric: lining-nums; }
.fact .l { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.35; }

/* ---------------------------------------------------------------- cartes */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 24px; align-items: start; padding-bottom: 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { padding: 20px 24px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card-h h2 { font: 500 26px/1.1 var(--serif); margin: 0; }
.card-b { padding: 18px 24px 24px; }
.step { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 22px 0 12px;
  display: flex; align-items: center; gap: 10px; }
.step::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.step:first-child { margin-top: 4px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 9px 8px; border-radius: 9px; cursor: pointer; font-weight: 500; color: var(--ink-2);
  font-size: 13.5px; line-height: 1.25; transition: background .15s, color .15s; }
.seg label small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.seg input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg.sun { grid-auto-columns: minmax(0, 1fr); }
.seg.sun label { padding: 8px 4px; font-size: 12.5px; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.field > span, .lab { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--muted); min-height: 1.2em; }
select, input[type="text"], input[type="number"], input[type="date"], input[type="time"] {
  width: 100%; font: 500 15px/1.2 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; outline: none; font-variant-numeric: tabular-nums; }
select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input.bad { border-color: var(--accent); }
.big-input { font: 500 26px/1.1 var(--serif) !important; letter-spacing: .01em; padding: 10px 14px !important; }

.slider { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 12px; align-items: center; }
.slider .num { position: relative; }
.slider .num input { padding-right: 34px; text-align: right; }
.slider .num i { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: 12.5px; pointer-events: none; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: var(--surface-2); outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--surface);
  border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .2); cursor: pointer; }
input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); cursor: pointer; }
input[type="range"]::-moz-range-progress { background: var(--accent); height: 6px; border-radius: 999px; }
input[type="range"]:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }

details.more { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
details.more summary { cursor: pointer; font-weight: 500; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 8px; font-size: 14px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px;
  background: var(--surface-2); color: var(--ink-2); font-weight: 600; }
details.more[open] summary::before { content: "–"; }
.custom-loc { display: none; }
.custom-loc.on { display: grid; }

/* ---------------------------------------------------------------- résultat */
.result { position: sticky; top: 16px; }
.r-head { padding: 22px 24px 18px; border-bottom: 1px solid var(--line); }
.r-label { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.r-main { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; margin-top: 12px; }
.r-pace { font: 500 clamp(52px, 7vw, 76px)/.95 var(--serif); letter-spacing: -.01em; font-variant-numeric: lining-nums tabular-nums; }
.r-pace small { font: 500 18px/1 var(--sans); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.r-time { font: 500 30px/1 var(--serif); color: var(--ink-2); font-variant-numeric: lining-nums tabular-nums; }
.r-ci { margin-top: 12px; color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.r-ci b { font-weight: 600; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.chip .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, .25); }
.chip.delta { background: var(--accent-soft); border-color: transparent; color: var(--accent-2); }
:root[data-theme="dark"] .chip.delta { color: var(--accent-2); }
.r-body { padding: 18px 24px 22px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.kv div { background: var(--surface); padding: 12px 14px; }
.kv .k { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.kv .v { font: 500 21px/1.15 var(--serif); margin-top: 4px; font-variant-numeric: lining-nums tabular-nums; }
.kv .v small { font: 500 12px var(--sans); color: var(--muted); }
.chart-h { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 4px; gap: 10px; }
.chart-h h3 { font: 500 18px/1.2 var(--serif); margin: 0; }
.chart-h span { font-size: 12px; color: var(--muted); text-align: right; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font: 11px var(--sans); fill: var(--muted); font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.35; padding: 7px 9px;
  border-radius: 8px; white-space: nowrap; transform: translate(-50%, -115%); opacity: 0; transition: opacity .12s; font-variant-numeric: tabular-nums; }
.note { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; display: none; }
.note.on { display: block; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.stop { background: var(--stop-bg); color: var(--stop-ink); }
.note b { font-weight: 600; }
.empty .r-pace { color: var(--muted); }

/* ---------------------------------------------------------------- méthode */
.method { padding: 22px 0 10px; }
.method h2 { font: 500 34px/1.1 var(--serif); margin: 0 0 6px; }
.method > p { color: var(--ink-2); max-width: 72ch; margin: 0 0 22px; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
.col .no { font: 500 italic 30px/1 var(--serif); color: var(--accent); }
.col h3 { font: 500 21px/1.2 var(--serif); margin: 8px 0 8px; }
.col p { margin: 0; color: var(--ink-2); font-size: 14px; }
.col code { font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.links a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 9px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; }
.links a:hover { border-color: var(--accent); color: var(--accent); }
footer { color: var(--muted); font-size: 12.5px; padding: 28px 0 36px; border-top: 1px solid var(--line); margin-top: 28px;
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; gap: 24px; padding-top: 30px; }
  .grid { grid-template-columns: 1fr; }
  .result { position: static; }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 14px; }
  .card-h, .card-b, .r-head, .r-body { padding-left: 16px; padding-right: 16px; }
  .row3 { grid-template-columns: 1fr 1fr; }
  .kv { grid-template-columns: 1fr 1fr; }
  .kv div:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .seg.sun label small { display: none; }
  .facts .fact .n { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

    const ml = frac((280.460 + 0.9856474 * days) / 360) * 2 * Math.PI;
    const mo = (23.439 - 4.0e-7 * days) * DEG_RAD;
    const ecl = (1.915 * Math.sin(ma) + 0.020 * Math.sin(2 * ma)) * DEG_RAD + ml;
    const dist = 1.00014 - 0.01671 * Math.cos(ma) - 0.00014 * Math.cos(2 * ma);
    let ra = Math.atan2(Math.cos(mo) * Math.sin(ecl), Math.cos(ecl));
    if (ra < 0) ra += 2 * Math.PI;
    ra = frac(ra / (2 * Math.PI)) * 24;
    const dec = Math.asin(Math.sin(mo) * Math.sin(ecl));
    let g0 = 24110.54841 + cent * (8640184.812866 + cent * (0.093104 - cent * 6.2e-6));
    g0 = frac(g0 / 3600 / 24) * 24; if (g0 < 0) g0 += 24;

    lmst = frac(lmst / 24) * 24; if (lmst < 0) lmst += 24;
    let lha = lmst - ra;
    if (lha < -12) lha += 24; else if (lha > 12) lha -= 24;
    const latr = lat * DEG_RAD; lha = lha / 24 * 2 * Math.PI;
    let alt = Math.asin(Math.sin(dec) * Math.sin(latr) + Math.cos(dec) * Math.cos(lha) * Math.cos(latr));
    const tanAlt = Math.abs(alt) < 1.57079615 ? Math.tan(alt) : 6.0e6;
    alt /= DEG_RAD;

    if (alt < -1 || tanAlt === 6.0e6) refr = 0;
    else if (alt < 19.225) refr = (0.1594 + alt * (0.0196 + 0.00002 * alt)) * 1013.25 / ((1 + alt * (0.505 + 0.0845 * alt)) * 288);

    } else { j = dT >= 0 ? 6 : 5; i = speed >= 2.5 ? 2 : speed >= 2.0 ? 1 : 0; }

  }
  function windAt2m(speed, zspeed, stab, urban) {
    const ex = urban ? [0.15, 0.15, 0.20, 0.25, 0.30, 0.30] : [0.07, 0.07, 0.10, 0.15, 0.35, 0.55];

function toUtc(dateStr, hour, tz) {
  const [y, mo, d] = dateStr.split("-").map(Number);
  const h = Math.trunc(hour), mi = Math.round((hour % 1) * 60) % 60;
  const guess = Date.UTC(y, mo - 1, d, h, mi);
  if (typeof tz === "number") return new Date(guess - tz * 3600e3);
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const offset = t => {
    const p = {}; fmt.formatToParts(new Date(t)).forEach(x => { p[x.type] = x.value; });
    return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - t;
  };
  const t1 = guess - offset(guess);
  return new Date(guess - offset(t1));

   ===================================================================================================== */
const Tool = (() => {
  const EV = {}; MODEL.ev.forEach(e => { EV[e.id] = e; });
  const delta = (c, g, W, lev, altKm, v, p) => c[g] * (W - 15) + c[5] * (W - 15) * lev / 10 + c[6 + g] * altKm + c[11] * (v - 2) + c[12] * p;
  const quantile = (s, q) => { const h = (s.length - 1) * q, lo = Math.floor(h), hi = Math.min(lo + 1, s.length - 1); return s[lo] + (h - lo) * (s[hi] - s[lo]); };
  const level = (id, sx, Y) => 100 * Math.log(EV[id].d / Y / MODEL.rp[sx + "|" + id]);
  function outOfRange(id, W, altM) {
    const g = EV[id].g, [lo, hi] = MODEL.wr[g];
    return { wbgt: !(W >= lo && W <= hi), alt: altM > Math.max(500, MODEL.am[g]), lo, hi, altMax: Math.max(500, MODEL.am[g]) };
  }
  function forward(id, sx, Y, W, altM, v, p) {
    const g = EV[id].g, lev = level(id, sx, Y), a = Math.max(0, altM - 500) / 1000;
    const d = delta(MODEL.f, g, W, lev, a, v, p);
    const ds = MODEL.b.map(c => delta(c, g, W, lev, a, v, p)).sort((x, y) => x - y);
    const dLo = quantile(ds, 0.025), dHi = quantile(ds, 0.975);
    return { delta: d, dLo, dHi, X: Y * Math.exp(-d / 100), Xlow: Y * Math.exp(-dHi / 100), Xhigh: Y * Math.exp(-dLo / 100), lev };
  }
  function solve(c, id, sx, X, W, altM, v, p) {               // Y tel que Y exp(-Delta(Y)/100) = X
    const g = EV[id].g, a = Math.max(0, altM - 500) / 1000;
    const f = Y => Y * Math.exp(-delta(c, g, W, level(id, sx, Y), a, v, p) / 100) - X;
    let lo = 0.8 * X, hi = 1.25 * X, flo = f(lo);
    for (let n = 0; n < 80 && hi - lo > 1e-9; n++) {
      const mid = 0.5 * (lo + hi), fm = f(mid);
      if ((fm < 0) === (flo < 0)) { lo = mid; flo = fm; } else hi = mid;

  }

    const Y = solve(MODEL.f, id, sx, X, W, altM, v, p);
    const ys = MODEL.b.map(c => solve(c, id, sx, X, W, altM, v, p)).sort((x, y) => x - y);
    const r = forward(id, sx, Y, W, altM, v, p);

  ["3000m", "3 000 m", "3,000 m", 1], ["3000m steeple", "3 000 m steeple", "3,000 m steeplechase", 1],
  ["5000m", "5 000 m", "5,000 m", 1], ["10000m", "10 000 m", "10,000 m", 1],
  ["5 km route", "5 km route", "5 km road", 2], ["10 km route", "10 km route", "10 km road", 2],
  ["semi-marathon", "Semi-marathon", "Half marathon", 2], ["marathon", "Marathon", "Marathon", 2]
];
const CITIES = {   // latitude, longitude, fuseau, altitude (m)
  paris: [48.85, 2.35, "Europe/Paris", 35], lyon: [45.76, 4.84, "Europe/Paris", 170], marseille: [43.30, 5.37, "Europe/Paris", 10],
  bordeaux: [44.84, -0.58, "Europe/Paris", 10], lille: [50.63, 3.06, "Europe/Paris", 20], nantes: [47.22, -1.55, "Europe/Paris", 10],
  london: [51.51, -0.13, "Europe/London", 10], berlin: [52.52, 13.40, "Europe/Berlin", 35], valencia: [39.47, -0.38, "Europe/Madrid", 15],
  rome: [41.90, 12.50, "Europe/Rome", 20], nyc: [40.71, -74.01, "America/New_York", 10], boston: [42.36, -71.06, "America/New_York", 10],
  chicago: [41.88, -87.63, "America/Chicago", 180], tokyo: [35.68, 139.69, "Asia/Tokyo", 40], doha: [25.29, 51.53, "Asia/Qatar", 10],
  sydney: [-33.87, 151.21, "Australia/Sydney", 20], nairobi: [-1.29, 36.82, "Africa/Nairobi", 1795],
  mexico: [19.43, -99.13, "America/Mexico_City", 2240], boulder: [40.01, -105.27, "America/Denver", 1655]
};
const SUN = [0, 120, 300, 600, 900];
const FLAG_COLORS = ["#F3F0E8", "#2F8A57", "#E2B33C", "#C8442F", "#1A1A1A"];

let lang = "fr";
const $ = id => document.getElementById(id);
const L = () => I18N[lang];
const nf = d => new Intl.NumberFormat(lang === "fr" ? "fr-FR" : "en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const num = (x, d) => nf(d).format(x).replace("-", "−");
const signed = (x, d) => (x > 0 ? "+" : x < 0 ? "−" : "") + nf(d).format(Math.abs(x));

/* ---------------------------------------------------------------- chronos */
function parseTime(str, dist, isPace) {
  const s = String(str).trim().replace(/\s+/g, "").replace(",", ".").replace(/[hH]/g, ":").replace(/['’′]/g, ":").replace(/["”″]/g, "").replace(/:$/, "");
  if (!/^\d+(?::\d+(?:\.\d+)?){0,2}(?:\.\d+)?$/.test(s)) return null;
  const p = s.split(":").map(Number);
  let sec;
  if (p.length === 3) sec = p[0] * 3600 + p[1] * 60 + p[2];
  else if (p.length === 2) sec = (!isPace && dist >= 21000) ? p[0] * 3600 + p[1] * 60 : p[0] * 60 + p[1];
  else sec = isPace ? p[0] * 60 : (dist >= 21000 ? p[0] * 60 : p[0]);
  if (p.length >= 2 && p[p.length - 1] >= 60) return null;
  if (isPace) sec *= dist / 1000;
  const v = dist / sec;
  return (sec > 0 && v > 1.2 && v < 11) ? sec : null;
}
function fmtTime(sec, dist) {
  if (!isFinite(sec)) return "–";
  if (sec >= 3600) {
    let t = Math.round(sec); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }
  if (dist <= 3000) {
    let t = Math.round(sec * 10) / 10; let m = Math.floor(t / 60), s = t - 60 * m;
    return `${m}:${s.toFixed(1).padStart(4, "0")}`;
  }
  let t = Math.round(sec); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
}
function fmtPace(speed) {
  if (!isFinite(speed)) return "–";
  let t = Math.round(1000 / speed); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
}
function fmtDiff(sec) {
  const a = Math.abs(sec), sign = sec > 0.05 ? "+" : sec < -0.05 ? "−" : "±";
  if (a < 60) return `${sign}${a < 10 ? a.toFixed(1) : Math.round(a)} s`;
  const m = Math.floor(Math.round(a) / 60), s = Math.round(a) % 60;
  return `${sign}${m} min ${String(s).padStart(2, "0")} s`;
}

/* ---------------------------------------------------------------- construction des contrôles */
function buildEvents() {
  const sel = $("event"), cur = sel.value || "marathon";
  sel.innerHTML = "";
  L().evGroups.forEach((name, k) => {
    const og = document.createElement("optgroup"); og.label = name;
    EVENTS.filter(e => e[3] === k).forEach(e => { const o = new Option(lang === "fr" ? e[1] : e[2], e[0]); og.appendChild(o); });
    sel.appendChild(og);
  });
  sel.value = cur;
}
function buildCities() {
  const sel = $("city"), cur = sel.value || "paris";
  sel.innerHTML = "";
  Object.keys(CITIES).concat(["other"]).forEach(k => sel.appendChild(new Option(L().cities[k], k)));
  sel.value = cur;
}
function buildSun() {
  const box = $("sun-seg"), cur = document.querySelector('input[name="sun"]:checked');
  const k0 = cur ? +cur.value : 2;
  box.innerHTML = L().sunPresets.map((p, k) =>
    `<input type="radio" name="sun" id="sun-${k}" value="${k}"${k === k0 ? " checked" : ""}><label for="sun-${k}">${p[0]}<small>${p[1]}</small></label>`).join("");
  box.querySelectorAll("input").forEach(i => i.addEventListener("change", () => { $("rad").value = SUN[+i.value]; update(); }));
}
function applyLang(l) {
  lang = l;
  document.documentElement.lang = l;
  try { localStorage.setItem("eep-lang", l); } catch (e) { /* stockage indisponible */ }
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = L()[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = L()[el.dataset.i18nHtml]; });
  $("n-perf").textContent = num(10398, 0);
  $("lk-article").href = `heat_stress_running_performance_${l}.pdf`;
  $("lk-nb").href = `equal_effort_pace_modeling_${l}.ipynb`;
  buildEvents(); buildCities(); buildSun();
  update();
}

/* ---------------------------------------------------------------- lecture du formulaire */
const val = id => parseFloat(String($(id).value).replace(",", "."));
function readForm() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const id = $("event").value, sx = document.querySelector('input[name="sex"]:checked').value;
  const isPace = document.querySelector('input[name="tunit"]:checked').value === "p";
  const ev = Tool.EV[id];
  const sec = parseTime($("time").value, ev.d, isPace);
  const city = $("city").value;
  let lat, lon, tz;
  if (city === "other") { lat = val("lat"); lon = val("lon"); tz = val("utc"); }
  else [lat, lon, tz] = CITIES[city];
  const [hh, mm] = ($("hour").value || "09:00").split(":").map(Number);
  return { mode, id, sx, isPace, ev, sec, T: val("T"), RH: val("RH"), V: val("V") / 3.6, rad: Math.max(0, val("rad") || 0),
    alt: Math.max(0, val("alt") || 0), rain: Math.max(0, val("rain") || 0), lat, lon, tz,
    date: $("date").value, hour: (hh || 0) + (mm || 0) / 60 };
}

/* ---------------------------------------------------------------- calcul et affichage */
function update() {
  const f = readForm(), t = L(), d = f.ev.d, g = f.ev.g;
  $("time-label").textContent = f.isPace ? (f.mode === "f" ? t.paceF : t.paceI) : (f.mode === "f" ? t.timeF : t.timeI);
  $("sun-hint").textContent = t.sunHint(num(f.rad, 0));
  $("custom-loc").classList.toggle("on", $("city").value === "other");
  $("r-label").textContent = f.mode === "f" ? t.labelF : t.labelI;
  $("time").classList.toggle("bad", f.sec === null);
  const result = $("result");
  const reset = msg => {
    result.classList.add("empty"); $("r-pace").innerHTML = "–"; $("r-time").textContent = ""; $("r-ci").innerHTML = msg || "";
    $("chips").innerHTML = ""; $("kv").innerHTML = "";
  };
  const notes = { warn: [], stop: [] };
  const showNotes = () => {
    ["warn", "stop"].forEach(k => { const el = $("note-" + k); el.innerHTML = notes[k].join("<br><br>"); el.classList.toggle("on", notes[k].length > 0); });
  };
  if (f.sec === null || !isFinite(f.T) || !isFinite(f.RH) || !isFinite(f.V) || !f.date) {
    $("time-hint").textContent = f.sec === null ? t.bad : "";
    reset(); showNotes(); drawChart(null); return;
  }
  $("time-hint").textContent = t.hintTime(fmtTime(f.sec, d), fmtPace(d / f.sec));

  const utc = toUtc(f.date, f.hour, f.tz);
  const w = Liljegren.wbgt(utc, f.lat, f.lon, f.rad, pressureAt(f.alt), f.T, Math.min(100, Math.max(1, f.RH)), f.V);
  const W = w.wbgt;
  const flagK = W < 10 ? 0 : W < 18 ? 1 : W < 23 ? 2 : W < 28 ? 3 : 4;
  const flagChip = `<span class="chip"><span class="sw" style="background:${FLAG_COLORS[flagK]}"></span>WBGT ${num(W, 1)} °C · ${t.flags[flagK]}</span>`;
  const oor = Tool.outOfRange(f.id, W, f.alt);
  if (W >= 23) notes.warn.push(t.warnRed);
  if (g === 0 && !oor.wbgt) notes.warn.push(t.warnMid);

  let Yref = f.mode === "f" ? d / f.sec : null;
  if (oor.wbgt || oor.alt) {
    if (oor.wbgt) notes.stop.push(t.stopW(num(oor.lo, 1), num(oor.hi, 1), t.groups[g]));
    if (oor.alt) notes.stop.push(t.stopA(num(oor.altMax, 0), t.groups[g]));
    reset(); $("chips").innerHTML = flagChip; showNotes();
    drawChart({ f, W, Y: Yref || d / f.sec, inRange: false }); return;
  }
  result.classList.remove("empty");
  let res, lev, deltaTxt;
  if (f.mode === "f") {
    res = Tool.forward(f.id, f.sx, Yref, W, f.alt, f.V, f.rain); lev = res.lev;
    const tX = d / res.X;
    $("r-pace").innerHTML = `${fmtPace(res.X)}<small>/km</small>`;
    $("r-time").textContent = fmtTime(tX, d);
    $("r-ci").innerHTML = t.ciF(`${fmtTime(d / res.Xhigh, d)}`, `${fmtTime(d / res.Xlow, d)}`);
    deltaTxt = res.delta;
    $("kv").innerHTML = kv(t.kRef, `${fmtPace(Yref)}<small> /km</small>`, fmtTime(f.sec, d))
      + kv(t.kCaut, `${fmtPace(res.Xlow)}<small> /km</small>`, `${fmtTime(d / res.Xlow, d)} · ${t.kCautS}`)
      + kv(t.kDiff, fmtDiff(tX - f.sec), `${signed(res.delta, 2)} %`);
  } else {
    res = Tool.inverse(f.id, f.sx, d / f.sec, W, f.alt, f.V, f.rain); lev = res.lev; Yref = res.Y;
    $("r-pace").innerHTML = `${fmtPace(res.Y)}<small>/km</small>`;
    $("r-time").textContent = fmtTime(d / res.Y, d);
    $("r-ci").innerHTML = t.ciI(`${fmtTime(d / res.Yhigh, d)}`, `${fmtTime(d / res.Ylow, d)}`);
    deltaTxt = res.delta;
    $("kv").innerHTML = kv(t.kRun, `${fmtPace(d / f.sec)}<small> /km</small>`, fmtTime(f.sec, d))
      + kv(t.kDelta, `${signed(res.delta, 2)}<small> %</small>`, `[${signed(res.dLo, 2)}${lang === "fr" ? " ; " : ", "}${signed(res.dHi, 2)}]`)
      + kv(t.kDiff, fmtDiff(d / res.Y - f.sec), t.labelI.toLowerCase());
  }
  const dir = Math.abs(deltaTxt) < 0.005 ? t.same : deltaTxt > 0 ? t.slower : t.faster;
  $("chips").innerHTML = `<span class="chip delta">Δ ${signed(deltaTxt, 2)} % · ${dir}</span>` + flagChip
    + `<span class="chip">${t.kNwb} ${num(w.tnwb, 1)} °C · ${t.kGlobe} ${num(w.tg, 1)} °C</span>`;
  const lp = MODEL.lv[f.sx + "|" + f.id];
  if (lp && (lev < lp[0] || lev > lp[1])) {
    const rp = MODEL.rp[f.sx + "|" + f.id];
    notes.warn.push(t.warnLev(fmtTime(rp * Math.exp(lp[0] / 100), d), fmtTime(rp * Math.exp(lp[1] / 100), d)));
  }
  showNotes();
  drawChart({ f, W, Y: Yref, inRange: true });
}
const kv = (k, v, s) => `<div><div class="k">${k}</div><div class="v">${v}</div><div class="k" style="margin-top:3px">${s}</div></div>`;

/* ---------------------------------------------------------------- graphique Δ(WBGT) avec bande à 95 % */
function drawChart(o) {
  const box = $("chart"), tip = $("tip");
  box.querySelectorAll("svg").forEach(s => s.remove());
  const t = L();
  if (!o) { $("chart-sub").textContent = ""; return; }
  const { f, W } = o, g = f.ev.g, [lo, hi] = MODEL.wr[g];
  $("chart-sub").textContent = t.chartSub(t.groupsShort[g]);
  const ws = []; for (let x = lo; x <= hi + 1e-9; x += (hi - lo) / 80) ws.push(x);
  const pts = Tool.curve(f.id, f.sx, o.Y, f.alt, f.V, f.rain, ws);
  const xmin = Math.max(-5, Math.min(lo, W) - 1), xmax = Math.min(45, Math.max(hi, W) + 1);
  let ymin = Math.min(0, ...pts.map(p => p.lo)), ymax = Math.max(0, ...pts.map(p => p.hi));
  const pad = (ymax - ymin) * 0.08 || 0.5; ymin -= pad; ymax += pad;
  const Wd = Math.round(Math.max(300, Math.min(640, box.clientWidth || 560))), Hd = Math.round(Math.max(210, Wd * 0.45));
  const m = { l: 44, r: 14, t: 14, b: 36 };
  const X = x => m.l + (x - xmin) / (xmax - xmin) * (Wd - m.l - m.r), Y = y => m.t + (ymax - y) / (ymax - ymin) * (Hd - m.t - m.b);
  const ticks = (a, b, n, steps = [0.25, 0.5, 1, 2, 5, 10]) => { const st = steps.find(s => (b - a) / s <= n) || 10; const out = []; for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) out.push(+v.toFixed(6)); return out; };
  const css = getComputedStyle(document.documentElement);
  const c = n => css.getPropertyValue(n).trim();
  let s = `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="${t.chartTitle}">`;
  ticks(ymin, ymax, 6).forEach(v => { s += `<line x1="${m.l}" x2="${Wd - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c("--line")}" stroke-width="${v === 0 ? 1.2 : 1}"/>`
    + `<text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${(v > 0 ? "+" : "") + num(v, Math.abs(v) < 1 && v !== 0 ? 1 : 0).replace(/^0$/, "0")}</text>`; });
  ticks(xmin, xmax, Math.max(5, Math.floor(Wd / 55)), [1, 2, 5, 10]).forEach(v => { s += `<text x="${X(v)}" y="${Hd - m.b + 18}" text-anchor="middle">${num(v, 0)}</text>`; });
  s += `<text x="${Wd - m.r}" y="${Hd - 4}" text-anchor="end">${t.axisX}</text><text x="${m.l - 36}" y="${m.t - 2}" text-anchor="start">${t.axisY}</text>`;
  [[xmin, lo], [hi, xmax]].forEach(([a, b]) => { if (b - a > 0.05) s += `<rect x="${X(a)}" y="${m.t}" width="${X(b) - X(a)}" height="${Hd - m.t - m.b}" fill="${c("--surface-2")}" opacity=".55"/>`; });
  [lo, hi].forEach(v => { s += `<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${Hd - m.b}" stroke="${c("--line")}" stroke-dasharray="2 3"/>`; });
  if (lo - xmin > 1.5) s += `<text x="${(X(xmin) + X(lo)) / 2}" y="${m.t + 14}" text-anchor="middle">${t.outZone}</text>`;
  if (xmax - hi > 1.5) s += `<text x="${(X(hi) + X(xmax)) / 2}" y="${m.t + 14}" text-anchor="middle">${t.outZone}</text>`;
  s += `<line x1="${X(15)}" x2="${X(15)}" y1="${m.t}" y2="${Hd - m.b}" stroke="${c("--muted")}" stroke-dasharray="3 4"/>`
    + `<text x="${X(15) + 5}" y="${Hd - m.b - 6}">${t.refLine}</text>`;
  s += `<path d="M${pts.map(p => `${X(p.W)},${Y(p.hi)}`).join("L")}L${pts.slice().reverse().map(p => `${X(p.W)},${Y(p.lo)}`).join("L")}Z" fill="${c("--band")}"/>`;
  s += `<path d="M${pts.map(p => `${X(p.W)},${Y(p.d)}`).join("L")}" fill="none" stroke="${c("--accent")}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<g id="hover" style="display:none"><line id="hv-l" y1="${m.t}" y2="${Hd - m.b}" stroke="${c("--ink-2")}" stroke-width="1"/><circle id="hv-c" r="4.5" fill="${c("--accent")}" stroke="${c("--surface")}" stroke-width="2"/></g>`;
  if (o.inRange) {
    const p = Tool.curve(f.id, f.sx, o.Y, f.alt, f.V, f.rain, [W])[0];
    s += `<circle cx="${X(W)}" cy="${Y(p.d)}" r="6.5" fill="${c("--accent")}" stroke="${c("--surface")}" stroke-width="2.5"/>`;
  } else {
    s += `<line x1="${X(W)}" x2="${X(W)}" y1="${m.t}" y2="${Hd - m.b}" stroke="${c("--accent")}" stroke-width="2" stroke-dasharray="5 4"/>`;
  }
  s += `<rect id="hit" x="${X(lo)}" y="${m.t}" width="${X(hi) - X(lo)}" height="${Hd - m.t - m.b}" fill="transparent" style="cursor:crosshair"/></svg>`;
  box.insertAdjacentHTML("afterbegin", s);
  const svg = box.querySelector("svg"), hit = svg.querySelector("#hit"), hv = svg.querySelector("#hover");
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * Wd;
    const x = xmin + (sx - m.l) / (Wd - m.l - m.r) * (xmax - xmin);
    const k = Math.max(0, Math.min(pts.length - 1, Math.round((x - lo) / (hi - lo) * (pts.length - 1)))), p = pts[k];
    hv.style.display = ""; svg.querySelector("#hv-l").setAttribute("x1", X(p.W)); svg.querySelector("#hv-l").setAttribute("x2", X(p.W));
    svg.querySelector("#hv-c").setAttribute("cx", X(p.W)); svg.querySelector("#hv-c").setAttribute("cy", Y(p.d));
    tip.innerHTML = t.tip(num(p.W, 1), signed(p.d, 2), signed(p.lo, 2), signed(p.hi, 2));
    tip.style.left = `${X(p.W) / Wd * r.width}px`; tip.style.top = `${Y(p.hi) / Hd * r.height}px`; tip.style.opacity = 1;
  };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { hv.style.display = "none"; tip.style.opacity = 0; });
}

/* ---------------------------------------------------------------- liaisons */
function link(a, b) {
  $(a).addEventListener("input", () => { $(b).value = $(a).value; update(); });
  $(b).addEventListener("input", () => { if ($(b).value !== "") $(a).value = $(b).value; update(); });
}
link("T-r", "T"); link("RH-r", "RH"); link("V-r", "V");
["time", "alt", "rain", "date", "hour", "lat", "lon", "utc"].forEach(id => $(id).addEventListener("input", update));
$("event").addEventListener("change", () => {
  const isPace = document.querySelector('input[name="tunit"]:checked').value === "p";
  if (!isPace) {   // propose un chrono de référence typique : le record médian de la catégorie
    const sx = document.querySelector('input[name="sex"]:checked').value, id = $("event").value;
    $("time").value = fmtTime(MODEL.rp[sx + "|" + id], Tool.EV[id].d);
  }
  update();
});
$("rad").addEventListener("input", () => {
  const v = val("rad"); let k = 0, best = 1e9; SUN.forEach((s, i) => { if (Math.abs(s - v) < best) { best = Math.abs(s - v); k = i; } });
  document.querySelectorAll('input[name="sun"]').forEach(i => { i.checked = +i.value === k && best < 1; }); update();
});
$("city").addEventListener("change", () => { const c = CITIES[$("city").value]; if (c) $("alt").value = c[3]; update(); });
document.querySelectorAll('input[name="mode"], input[name="sex"]').forEach(i => i.addEventListener("change", update));
document.querySelectorAll('input[name="tunit"]').forEach(i => i.addEventListener("change", () => {
  const f = readForm(), d = f.ev.d, sec = parseTime($("time").value, d, !f.isPace);
  if (sec) $("time").value = f.isPace ? fmtPace(d / sec) : fmtTime(sec, d);
  update();
}));
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("eep-theme", document.documentElement.dataset.theme); } catch (e) { /* stockage indisponible */ }
  update();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update);
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(update, 120); });

(function init() {
  let l = "fr", th = null;
  try { l = localStorage.getItem("eep-lang") || ((navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en"); th = localStorage.getItem("eep-theme"); }
  catch (e) { l = (navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en"; }
  if (th) document.documentElement.dataset.theme = th;
  const now = new Date();
  $("date").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  applyLang(l);
})();
</script>
